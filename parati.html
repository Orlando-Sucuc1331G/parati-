<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Evelin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #2a0a1f 0%, #0d0210 70%, #05000a 100%);
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
  }
  canvas {
    position: fixed;
    inset: 0;
    display: block;
  }
  .flotantes {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .flotantes span {
    position: absolute;
    bottom: -40px;
    font-size: 18px;
    color: rgba(255, 80, 120, 0.35);
    animation: subir linear infinite;
  }
  @keyframes subir {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(-110vh) translateX(40px) rotate(40deg); opacity: 0; }
  }
  .mensaje {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 12%;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s ease;
  }
  .mensaje.visible { opacity: 1; }
  .mensaje h1 {
    font-size: clamp(1.8rem, 6vw, 3.5rem);
    font-weight: 300;
    letter-spacing: 0.15em;
    color: #ffd6e0;
    text-shadow: 0 0 10px #ff2d6f, 0 0 30px #ff2d6f, 0 0 60px #c2185b;
    animation: brillo 2.5s ease-in-out infinite alternate;
  }
  @keyframes brillo {
    from { text-shadow: 0 0 8px #ff2d6f, 0 0 20px #ff2d6f; }
    to   { text-shadow: 0 0 14px #ff2d6f, 0 0 40px #ff2d6f, 0 0 80px #c2185b; }
  }
  button {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 10px 20px;
    border: 1px solid rgba(255, 120, 160, 0.6);
    background: rgba(255, 45, 111, 0.15);
    color: #ffd6e0;
    font-size: 0.95rem;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
  }
  button:hover {
    background: rgba(255, 45, 111, 0.35);
    box-shadow: 0 0 20px rgba(255, 45, 111, 0.6);
    transform: scale(1.05);
  }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div class="flotantes" id="flotantes"></div>
<div class="mensaje" id="mensaje">
  <h1>♥ I LOVE YOU ♥</h1>
</div>

<button id="reiniciar">Formar de nuevo</button>

<script>
  const canvas = document.getElementById('lienzo');
  const ctx = canvas.getContext('2d');
  const mensaje = document.getElementById('mensaje');

  let W, H, escala, dpr;
  const NUM_PARTICULAS = 2200;
  let particulas = [];
  let inicio = performance.now();
  const mouse = { x: -9999, y: -9999 };

  function redimensionar() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    escala = Math.min(W, H) / 40;
  }

  function puntoCorazon(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    return { x, y };
  }

  function crearParticulas() {
    particulas = [];
    for (let i = 0; i < NUM_PARTICULAS; i++) {
      const t = Math.random() * Math.PI * 2;
      const p = puntoCorazon(t);
      const borde = Math.random() < 0.35;
      const f = borde ? 1 : Math.sqrt(Math.random()) * 0.97;
      const ang = Math.random() * Math.PI * 2;
      const dist = 25 + Math.random() * 40;
      particulas.push({
        x: Math.cos(ang) * dist,
        y: Math.sin(ang) * dist,
        vx: 0,
        vy: 0,
        tx: p.x * f,
        ty: p.y * f,
        retraso: Math.random() * 2500,
        tam: borde ? Math.random() * 1.6 + 1 : Math.random() * 1.4 + 0.6,
        tono: 340 + Math.random() * 25,
        luz: 50 + Math.random() * 20
      });
    }
  }

  function dispersar() {
    mensaje.classList.remove('visible');
    particulas.forEach(p => {
      const a = Math.random() * Math.PI * 2;
      const v = 0.6 + Math.random() * 1.6;
      p.vx = Math.cos(a) * v;
      p.vy = Math.sin(a) * v;
      p.retraso = Math.random() * 1200;
    });
    inicio = performance.now();
  }

  function latido(t) {
    const ciclo = (t % 1400) / 1400;
    const a = Math.exp(-Math.pow((ciclo - 0.10) * 14, 2));
    const b = Math.exp(-Math.pow((ciclo - 0.28) * 14, 2)) * 0.7;
    return 1 + (a + b) * 0.09;
  }

  function animar(ahora) {
    const t = ahora - inicio;

    ctx.fillStyle = 'rgba(10, 0, 15, 0.28)';
    ctx.fillRect(0, 0, W, H);

    const formado = t > 4200;
    const pulso = formado ? latido(ahora) : 1;
    if (formado) mensaje.classList.add('visible');

    const cx = W / 2;
    const cy = H / 2 - escala * 1.5;

    ctx.globalCompositeOperation = 'lighter';

    for (const p of particulas) {
      if (t > p.retraso) {
        p.vx += (p.tx - p.x) * 0.012;
        p.vy += (p.ty - p.y) * 0.012;
        p.vx *= 0.90;
        p.vy *= 0.90;
      } else {
        p.vx *= 0.99;
        p.vy *= 0.99;
      }
      const sx = cx + p.x * escala * pulso;
      const sy = cy + p.y * escala * pulso;
      const dx = sx - mouse.x;
      const dy = sy - mouse.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 6400) {
        const d = Math.sqrt(d2) || 1;
        const fuerza = (80 - d) / 80;
        p.vx += (dx / d) * fuerza * 0.35;
        p.vy += (dy / d) * fuerza * 0.35;
      }
      p.x += p.vx;
      p.y += p.vy;
      ctx.beginPath();
      ctx.fillStyle = `hsla(${p.tono}, 100%, ${p.luz}%, 0.85)`;
      ctx.arc(cx + p.x * escala * pulso, cy + p.y * escala * pulso, p.tam, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(animar);
  }
  function crearFlotantes() {
    const cont = document.getElementById('flotantes');
    for (let i = 0; i < 25; i++) {
      const s = document.createElement('span');
      s.textContent = '♥';
      s.style.left = Math.random() * 100 + '%';
      s.style.fontSize = (10 + Math.random() * 22) + 'px';
      s.style.animationDuration = (8 + Math.random() * 10) + 's';
      s.style.animationDelay = (Math.random() * 10) + 's';
      cont.appendChild(s);
    }
  }
  window.addEventListener('resize', redimensionar);
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('touchmove', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchend', () => { mouse.x = mouse.y = -9999; });
  window.addEventListener('mouseleave', () => { mouse.x = mouse.y = -9999; });
  document.getElementById('reiniciar').addEventListener('click', dispersar);
  redimensionar();
  crearParticulas();
  crearFlotantes();
  requestAnimationFrame(animar);
</script>
</body>
</html>
